aid: juleb
name: Juleb
description: >-
  Juleb is a Saudi Arabia-based pharma-tech and retail software company providing an
  integrated cloud platform for the health, retail, and distribution sectors. Its suite
  spans accounting and financial management, inventory and warehouse management, sales
  force automation (SFA), point of sale (POS), Rx e-prescription, e-commerce, and DSCSA
  regulatory compliance. Juleb connects to Saudi compliance systems (ZATCA/Fatoora, RSD,
  GS1, Wasfaty), e-commerce channels (Salla, Shopify, HungerStation), payment providers
  (Geidea, Alhamrani), and ERPs (Microsoft Dynamics). Founded by Yousuf Jamjoom and backed
  by 500 Global, Juleb exposes a REST API (documented at docs.juleb.com) covering inventory,
  point of sale, prescriptions, and partner/company resources.
